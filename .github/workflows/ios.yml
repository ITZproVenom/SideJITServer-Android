name: iOS companion

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project SideJITControl.xcodeproj \
            -scheme SideJITControl \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            build

      - name: Package the IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/SideJITControl.app"
          test -d "$APP"
          rm -rf Payload SideJITControl.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "SideJITControl-build-${GITHUB_RUN_NUMBER}.ipa" Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SideJITControl-ipa
          path: ios/*.ipa

      - name: Publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="ios-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" ios/*.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "SideJIT Control $TAG" \
            --prerelease \
            --notes "Unsigned iOS companion app for SideJITServer-Android. Sideload it with SideStore or AltStore; it is not signed here because this project has no Apple Developer membership."
